# The source register (decision 0009). Every data source the platform may touch is listed here with the
# evidence for whether its terms allow commercial use. A source whose status is `prohibited` cannot be enabled.
# Re-check each source's terms at least every six months and update `checked` (the gap check reminds you).
#
#   status: allowed     the terms permit commercial use (attribution as stated)
#           silent      no published terms found; used under the owner's rule, with the risk noted
#           prohibited  the terms forbid commercial use or redistribution; never run

# --- Not used by the product (kept so the decision and its evidence stay on record) -----------------------------

coinmetrics_community:
  name: Coin Metrics community API
  homepage: https://coinmetrics.io/
  enabled: false
  rights:
    status: prohibited
    evidence: Community data is licensed CC BY-NC 4.0 (non-commercial).
    url: https://docs.coinmetrics.io/packages/coin-metrics-community-data
    checked: 2026-10-11
  datasets: []

coinbase_exchange:
  name: Coinbase Exchange market data API
  homepage: https://www.coinbase.com/
  enabled: false
  rights:
    status: prohibited
    evidence: >-
      Market Data Terms: licence "solely for you", for "personal or research purposes", not to build an
      application for end users outside your organisation.
    url: https://www.coinbase.com/legal/market_data
    checked: 2026-10-11
  datasets: []

defillama:
  name: DefiLlama API
  homepage: https://defillama.com/
  enabled: false
  rights:
    status: prohibited
    evidence: >-
      Terms (24 Jun 2025): personal, non-commercial licence; "republish the data in any form without permission"
      and commercial exploitation "without prior written consent" are prohibited.
    url: https://defillama.com/terms
    checked: 2026-10-11
  datasets: []

binance_vision:
  name: Binance market data (data-api.binance.vision)
  homepage: https://www.binance.com/
  enabled: false
  rights:
    status: prohibited
    evidence: The Binance Vision dataset terms are titled "Terms of Use (Non-Commercial)".
    url: https://data.binance.vision/Binance_Vision-Terms_of_Use.pdf
    checked: 2026-10-11
  datasets: []

coingecko_free:
  name: CoinGecko API, free Demo plan
  homepage: https://www.coingecko.com/
  enabled: false
  rights:
    status: prohibited
    evidence: >-
      API terms (5 Sep 2025), clause 6.2: you may not "duplicate, reproduce, copy, store, derive from" the Data
      except as expressly permitted; the plan-specific permissions for commercial products are described for the
      paid plans (Basic $35/month upwards). Storing history, which this platform does, is therefore not permitted
      on the free plan.
    url: https://www.coingecko.com/en/api_terms
    checked: 2026-10-11
  datasets: []

# --- Researched 2026-10-18 for crypto analytics (docs/research/data-sources-2026-10-18.md) -------------------------

bitstamp:
  name: Bitstamp exchange market data (OHLC from 2011-09-14)
  homepage: https://www.bitstamp.net/
  enabled: true        # development and the owners' private preview only; a launch blocker until the agreement is signed
  rights:
    status: permission_required
    evidence: >-
      API documentation: "Companies seeking to utilize Bitstamp's exchange data for their own commercial purposes
      are directed to contact partners@bitstamp.net to receive and sign a commercial use Data License Agreement",
      which allows "the incorporation and redistribution of our exchange data for commercial purposes ... the
      right to create ratios, calculations, new original works, statistics". Fee not published.
    url: https://www.bitstamp.net/api/
    checked: 2026-10-18
    attribution: "Source: Bitstamp"
  datasets: [crypto.ohlc_daily]
  notes: >-
    The price source for the crypto section (decision 0019): daily candles for BTC, ETH and other majors in USD,
    and ETH in BTC, from data_platform/collectors/bitstamp. Enabled on 2026-10-18 for development; the commercial
    Data License Agreement (partners@bitstamp.net, draft in docs/letters/data-permission-requests.md) must be signed
    before the section is public, and the status then becomes `allowed`.

kraken:
  name: Kraken public market data and OHLCVT downloads
  homepage: https://www.kraken.com/
  enabled: false
  rights:
    status: prohibited
    evidence: >-
      Global Terms (updated 2026-10-19) §8 "Our Content": you may not "license, sublicense, sell, resell, transfer,
      assign, distribute or otherwise commercially exploit or make available to any third party Our Content in any
      way" without permission. Ask in writing before any use.
    url: https://www.kraken.com/legal/global-terms
    checked: 2026-10-21
  datasets: []

coinmarketcap_startup:
  name: CoinMarketCap API, Startup plan (paid)
  homepage: https://coinmarketcap.com/api/
  enabled: false
  rights:
    status: allowed
    evidence: >-
      Pricing FAQ: paid plans "include commercial use rights", licence for one product with up to 100k users, not
      to be redistributed as a standalone service. Startup (USD 79/month) includes all-time history. The website
      terms say "personal, non-commercial use unless you enter into a separate agreement": confirm in writing.
    url: https://coinmarketcap.com/api/pricing/
    checked: 2026-10-18
    attribution: "Data provided by CoinMarketCap.com"
  datasets: []
  notes: For market caps and dominance, if subscribed.

coinmarketcap_basic:
  name: CoinMarketCap API, Basic plan (free)
  homepage: https://coinmarketcap.com/api/
  enabled: false
  rights:
    status: allowed
    evidence: >-
      Pricing FAQ (read 2026-10-21): "Basic through Professional all include commercial use rights — the free Basic
      tier included … covers one product with up to 100k users." Commercial terms: display "solely on Your Product
      provided solely to end users … for their own personal, non-commercial purposes"; you "may (a) charge a fee for
      such usage by End Users, (b) temporarily store the Content to the extent necessary in order to make the Content
      available via Your Product, and (c) only distribute the Content as part of Your Product but not on a standalone
      basis". Basic carries one year of daily history only. Before relying on it, confirm in writing that Basic covers
      a paid educational site and that keeping our own daily history is allowed (letter in
      docs/letters/data-permission-requests.md).
    url: https://pro.coinmarketcap.com/user-agreement-commercial/
    checked: 2026-10-21
    attribution: "Data provided by CoinMarketCap.com"
  datasets: []
  notes: >-
    The no-cost start (plan §12.6): today's prices and short-run changes on the public site until revenue pays for
    a long history (Bitstamp's licence or CoinMarketCap Startup).

alternative_me_fng:
  name: alternative.me Crypto Fear & Greed Index
  homepage: https://alternative.me/crypto/fear-and-greed-index/
  enabled: false
  rights:
    status: allowed
    evidence: '"Commercial use is allowed as long as the attribution is given right next to the display of the data."'
    url: https://alternative.me/crypto/fear-and-greed-index/
    checked: 2026-10-18
    attribution: "Source: alternative.me Crypto Fear & Greed Index"
  datasets: []
