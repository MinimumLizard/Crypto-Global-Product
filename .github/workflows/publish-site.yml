# Publish the free site as plain files to Cloudflare Pages (plan §12.5, decision 0023), once a day after the models.
#
# The copy is made by crawling the real site as an anonymous visitor (web/scripts/export-static.mjs --public), so it
# holds exactly what a free visitor sees and nothing else (hard rule 4). It skips itself until the owners have set
# the repository variable PUBLISH_ENABLED=true and added the secrets, and it refuses to publish while any enabled data
# source still needs its publisher's permission (hard rule 2: data_platform.core.sources.launch_blockers).
name: "Publish: free site"

on:
  workflow_run:
    workflows: ["Models"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production                       # no test tiers, ever (web/lib/viewer.ts)
      DATABASE_URL: ${{ secrets.WEB_DATABASE_URL }}   # the read-only web_reader role, not the collectors' login
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Configured?
        id: cfg
        run: |
          if [ "${{ vars.PUBLISH_ENABLED }}" != "true" ]; then
            echo "::notice::PUBLISH_ENABLED is not 'true'. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATABASE_URL" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PAGES_PROJECT" ]; then
            echo "::notice::Not configured yet (WEB_DATABASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_PAGES_PROJECT missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Every data source shown may be shown publicly
        if: steps.cfg.outputs.ready == 'true'
        run: |
          uv sync --frozen --no-dev
          uv run --no-dev python -c "
          import sys
          from data_platform.core.sources import launch_blockers
          blockers = launch_blockers()
          sys.exit(f'Not publishing: these sources still need their publisher\'s permission: {blockers}' if blockers else 0)
          "
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site and copy what a free visitor sees
        if: steps.cfg.outputs.ready == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
          npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          BASE=http://127.0.0.1:3100 node scripts/export-static.mjs ../public-site --public
      - name: Deploy to Cloudflare Pages
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
