# Daily: Bitcoin block headers from the Bitcoin network itself (free; no terms apply: config/sources.yaml), every
# header verified before it is stored. The first run downloads the whole chain (about 80 MB, a few minutes).
name: "Collect: Bitcoin network"

on:
  schedule:
    - cron: "29 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-bitcoin-network
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      command: data_platform.jobs.collect bitcoin_network
      timeout: 30
    secrets: inherit
